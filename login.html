<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CTI Indonesia Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #B01A18; --accent-dk: #8c1412;
      --bg: #F3F4F6; --card: #fff;
      --border: #E5E7EB; --text: #1A1A1A; --muted: #6B7280;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 100%; max-width: 400px; padding: 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); }
    .logo { width: 80px; height: 80px; border-radius: 12px; object-fit: contain; display: block; margin: 0 auto 20px auto; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
    .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; text-align: center; }
    .error { display: none; background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 16px; align-items: center; gap: 8px; text-align: left; }
    .error.show { display: flex; }
    .btn {
      width: 100%; padding: 12px; background: #fff; color: #1a1a1a; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: background 0.2s, border-color 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn:hover:not(:disabled) { background: #f9fafb; border-color: #d1d5db; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { text-align: center; margin-top: 24px; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="logo.png" alt="CTI Group" class="logo">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to the Indonesia Monitoring Dashboard</p>

      <div class="error" id="err">
        <span>⚠</span><span id="errText"></span>
      </div>

      <button type="button" class="btn" id="msBtn">
        <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        <span id="msBtnText">Sign in with Microsoft</span>
      </button>

      <p class="footer">Authorised @cti-usa.com accounts only.<br>Unauthorised access is prohibited.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const err = document.getElementById('err');
    const errText = document.getElementById('errText');
    const msBtn = document.getElementById('msBtn');
    const msBtnText = document.getElementById('msBtnText');

    // Surface a sign-in error passed back via ?error= (e.g. wrong domain,
    // Azure org mismatch) if the callback ever links back here.
    const qsErr = new URLSearchParams(location.search).get('error');
    if (qsErr) { errText.textContent = qsErr; err.classList.add('show'); }

    msBtn.addEventListener('click', () => {
      msBtn.disabled = true;
      msBtnText.textContent = 'Redirecting to Microsoft…';
      Auth.loginWithMicrosoft();
    });

    // If a valid session already exists (bookmarked this page, or landed
    // here with a fragment token for some reason), skip straight to the app.
    (async () => {
      const user = await Auth.init();
      if (user) window.location.replace('index.html');
    })();
  </script>
</body>
</html>
